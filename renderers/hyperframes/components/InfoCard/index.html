<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>InfoCard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .card {
      background: white;
      border-radius: 32px;
      padding: 80px 60px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 900px;
      animation: slideInRight 0.7s ease-out;
    }
    .icon {
      font-size: 120px;
      margin-bottom: 40px;
      animation: bounce 1s ease-out 0.3s;
    }
    .heading {
      font-size: 56px;
      font-weight: 800;
      color: #212529;
      margin-bottom: 30px;
      animation: fadeIn 0.8s ease-out 0.4s both;
    }
    .content {
      font-size: 38px;
      color: #495057;
      line-height: 1.6;
      animation: fadeIn 0.8s ease-out 0.6s both;
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">💡</div>
    <div class="heading" id="heading">关键信息</div>
    <div class="content" id="content">这里展示重要的数据或观点</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const icon = params.get('icon') || window.HYPERFRAMES_DATA?.icon || '💡';
    const heading = params.get('heading') || window.HYPERFRAMES_DATA?.heading || '关键信息';
    const content = params.get('content') || window.HYPERFRAMES_DATA?.content || '这里展示重要的数据或观点';
    document.getElementById('icon').textContent = icon;
    document.getElementById('heading').textContent = heading;
    document.getElementById('content').textContent = content;
  </script>
</body>
</html>
