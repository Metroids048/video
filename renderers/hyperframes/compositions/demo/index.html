<!doctype html>
<html lang="zh-CN" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AVS Three Component Demo</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body, #demo-scenes { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #101820; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="demo-scenes" data-composition-id="demo-scenes" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="scene-hook" class="scene clip" data-composition-id="scene-hook" data-composition-src="components/HookTitle/index.html" data-start="0" data-duration="3" data-track-index="1"></div>
      <div id="scene-info" class="scene clip" data-composition-id="scene-info" data-composition-src="components/InfoCard/index.html" data-start="3" data-duration="4" data-track-index="1"></div>
      <div id="scene-end" class="scene clip" data-composition-id="scene-end" data-composition-src="components/EndCard/index.html" data-start="7" data-duration="3" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 10 });
      window.__timelines = window.__timelines || {};
      window.__timelines["demo-scenes"] = tl;
    </script>
  </body>
</html>
