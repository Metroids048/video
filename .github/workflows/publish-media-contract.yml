name: Publish Media Contract

on:
  push:
    branches:
      - agent/creator-os-v2-quality-fix
      - agent/video-quality-gate-v3
  pull_request:
    branches:
      - main
      - agent/creator-os-v2-quality-fix
  workflow_dispatch:

jobs:
  publish-media-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate Creator OS release gate
        run: python scripts/validate_creator_os_v2.py
      - name: Run publish media contract regression tests
        run: >-
          pytest -q
          tests/test_video_release_review.py
          tests/test_visual_approval.py
          tests/test_publish_media_contract.py
          tests/test_audio_publishability_contract.py
          tests/test_publish_layout_contract.py
          tests/test_publish_audio_levels_parse.py
          tests/test_canonical_audio_gate.py
          tests/test_screen_focus_single_view.py
          tests/test_ep01_focus_propagation.py
          tests/test_production_loop_publishing_quality.py
          tests/test_creator_os_v2_quality_regressions.py
          tests/test_render.py
          tests/test_creative_review.py
          tests/test_creator_os_v2_config.py
