name: Creator OS V2 quality regressions

on:
  push:
    branches:
      - agent/creator-os-v2-quality-fix
  workflow_dispatch:

jobs:
  quality-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run targeted regressions
        run: pytest -q tests/test_creator_os_v2_quality_regressions.py
