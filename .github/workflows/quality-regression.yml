name: Creator OS V2 quality regressions

on:
  push:
    branches:
      - agent/creator-os-v2
  pull_request:
    branches:
      - main
      - agent/creator-os-v2
  workflow_dispatch:

jobs:
  quality-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate Creator OS quality contract
        run: python scripts/validate_creator_os_v2.py
      - name: Run publish-quality regression suite
        run: >-
          pytest -q
          tests/test_video_release_review.py
          tests/test_visual_approval.py
          tests/test_creator_os_v2_quality_regressions.py
          tests/test_layouts.py
          tests/test_render.py
          tests/test_creative_review.py
          tests/test_creator_os_v2_config.py
