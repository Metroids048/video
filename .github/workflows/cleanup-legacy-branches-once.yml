name: Cleanup legacy branches once

on:
  push:
    branches:
      - agent/creator-os-v2

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete consolidated legacy branches
        run: |
          git push origin --delete agent/creator-os-v2-quality-fix
          git push origin --delete agent/video-quality-gate-v3
