name: Creator OS V2 Verify

on:
  push:
    branches:
      - agent/creator-os-v2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate Creator OS V2 contract
        run: python scripts/validate_creator_os_v2.py

      - name: Run test suite
        run: python -m pytest -q
