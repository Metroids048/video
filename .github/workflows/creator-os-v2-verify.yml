name: Creator OS V2 Verify

on:
  push:
    branches:
      - agent/creator-os-v2
      - agent/creator-os-v2-quality-fix
      - agent/video-quality-gate-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate Creator OS V2 contract
        run: python scripts/validate_creator_os_v2.py

      - name: Run test suite
        run: python -m pytest -q

      - name: Pack verified project snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=.pytest_cache \
            --exclude='**/__pycache__' \
            --exclude='*.egg-info' \
            -czf /tmp/creator-os-v2-project.tar.gz .

      - name: Upload verified project snapshot
        uses: actions/upload-artifact@v4
        with:
          name: creator-os-v2-project-${{ github.sha }}
          path: /tmp/creator-os-v2-project.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
