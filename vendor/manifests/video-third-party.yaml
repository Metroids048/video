# Video third-party skills vendor manifest
# Consumed by scripts/vendor_video_skills.py and scripts/ensure_video_plugins.py
version: 1
updated_at: "2026-08-03"

defaults:
  repos_dir: vendor/repos
  skills_dir: third_party_skills
  sync_targets:
    - .claude/skills
    - .agents/skills
    - .cursor/skills
  global_sync_targets:
    - ~/.claude/skills
    - ~/.codex/skills
    - ~/.cursor/skills

packages:
  hyperframes:
    kind: npm_bundle
    source_repository: https://github.com/heygen-com/hyperframes
    npm_package: hyperframes
    local_skills_glob: node_modules/hyperframes/dist/skills/*
    skill_names:
      - hyperframes
      - hyperframes-cli
    license: MIT
    usage: production_allowed
    note: "Copy from installed npm package; do not clone monorepo."

  remotion:
    kind: git_skills
    source_repository: https://github.com/remotion-dev/skills
    commit: "954abf64096dc18d1599cde9c8026c9ab71579a4"
    sparse_paths: []
    skill_source: .
    skill_dir_name: remotion
    license: MIT
    usage: production_allowed
    remotion_primary_renderer: true
    note: "Official Remotion agent skills; framework via npm separately."

  video-use:
    kind: git_skills
    source_repository: https://github.com/browser-use/video-use
    commit: "92c2b34e44c205cbc2acae7f6ca7c1c219d5dd66"
    # Full shallow clone — helpers/ must sit beside SKILL.md (cone sparse cannot mix files)
    sparse_paths: []
    skill_source: .
    skill_dir_name: video-use
    license: MIT
    usage: production_allowed

  seedance:
    kind: git_skills
    source_repository: https://github.com/automatorsplus/seedance-skill
    commit: "3c1c022d9e52cdbc737eb034a73461a47075f826"
    sparse_paths: []
    skill_source: .
    skill_dir_name: seedance
    license: unknown
    usage: production_allowed

  chatcut:
    kind: git_skills
    source_repository: https://github.com/ChatCut-Inc/agent-plugin
    commit: "e1867a8b48fae0153ef3542efb0ca8fa4e80ad3a"
    sparse_paths:
      - claude/skills
      - docs
      - README.md
    skill_source: claude/skills
    skill_dir_name: chatcut
    license: unknown
    usage: production_allowed
    note: "MCP login required on host; skills only vendored here."

  capcut-david:
    kind: git_skills
    source_repository: https://github.com/Davidb-2107/capcut-cli-david
    commit: "d9be57ee46ec42d8119e9fcfbb603250a8cd5fb3"
    sparse_paths:
      - skills
      - docs
      - README.md
      - package.json
      - dist
    skill_source: skills/capcut-david
    skill_dir_name: capcut-david
    license: unknown
    usage: production_allowed
    note: "Supersedes legacy cut-motion / cut-draft skills."

  cut-skill:
    kind: git_skills
    source_repository: https://github.com/ygtec/cut.skill
    commit: "a2408b82ce0b898d469eca4dd141870dbe056c49"
    sparse_paths: []
    skill_source: auto
    skill_dir_name: cut-skill
    license: unknown
    usage: production_allowed

  ip-strategist:
    kind: git_skills
    source_repository: https://github.com/erduo1998-cell/ip-strategist
    commit: "45e88feccc3841d4a981bea42fc656d723ded276"
    sparse_paths: []
    skill_source: auto
    skill_dir_name: ip-strategist
    license: unknown
    usage: production_allowed

  openmontage:
    kind: git_skills
    source_repository: https://github.com/calesthio/OpenMontage
    commit: "c36e41223e819441748817105635ac4036d41b10"
    sparse_paths:
      - skills
      - AGENT_GUIDE.md
      - PROJECT_CONTEXT.md
      - pipeline_defs
      - README.md
      - README_zh-CN.md
    skill_source: curated_entry
    skill_dir_name: openmontage
    license: AGPL-3.0
    usage: production_allowed
    note: "Sparse clone only; curated entry skill points at vendor/repos/openmontage."

  pixelle-video:
    kind: git_skills
    source_repository: https://github.com/AIDC-AI/Pixelle-Video
    commit: "848b054e4fae40dabc62ec58e960b573e83793ac"
    sparse_paths:
      - README.md
      - README_EN.md
      - LICENSE
      - NOTICE
      - config.example.yaml
      - pyproject.toml
      - docs
    skill_source: curated_entry
    skill_dir_name: pixelle-video
    license: Apache-2.0
    usage: production_allowed
    note: "Sparse docs/config only; curated entry skill. Do not full-clone ComfyUI monorepo into third_party_skills."

  # --- Batch 2026-08-03: high-star video skills (coexist with cut-skill) ---

  jianying-editor:
    kind: git_skills
    source_repository: https://github.com/luoluoluo22/jianying-editor-skill
    commit: "f421c8a036f4fda888a83b38fc90bb9c00d6faa9"
    sparse_paths: []
    skill_source: .
    skill_dir_name: jianying-editor
    license: MIT
    usage: production_allowed
    note: "JyWrapper 剪映自动化；与 cut-skill / capcut-david 场景分流并存。"

  ffmpeg:
    kind: git_skills
    source_repository: https://github.com/ychoi-kr/claude-ffmpeg-skill
    commit: "b88cb5ce08337ab55c66c67674100b8de29cf232"
    sparse_paths: []
    skill_source: .
    skill_dir_name: ffmpeg
    license: MIT
    usage: production_allowed
    note: "Local FFmpeg CLI skill; not cloud FFmpeg APIs."

  azure-speech:
    kind: git_skills
    source_repository: https://github.com/MicrosoftDocs/Agent-Skills
    commit: "118821d787cc3f7f192aa9fb9c391731dfd35b98"
    sparse_paths:
      - skills/azure-speech
    skill_source: skills/azure-speech
    skill_dir_name: azure-speech
    license: CC-BY-4.0
    usage: production_allowed
    note: "Official Azure Speech knowledge skill (TTS/STT). Requires Azure credentials in .env."

  elevenlabs:
    kind: git_skills
    source_repository: https://github.com/elevenlabs/skills
    commit: "37c0f2a682a8953cb9f09b152a0e1624d234193e"
    sparse_paths: []
    skill_source: multi_named
    skill_dir_name: elevenlabs
    skill_names:
      - text-to-speech
      - music
      - sound-effects
      - setup-api-key
    primary_skill: text-to-speech
    license: MIT
    usage: production_allowed
    note: "Official ElevenLabs skills; primary copy as elevenlabs from text-to-speech."

  ai-video-shot-prompt:
    kind: git_skills
    source_repository: https://github.com/Wayhhow/ai-video-shot-prompt-skill
    commit: "d7153aa1b5b4864a6322cc0ecdb2e7ac0adca9a9"
    sparse_paths: []
    skill_source: .
    skill_dir_name: ai-video-shot-prompt
    license: unknown
    usage: production_allowed
    note: "镜头脚本 / 分镜提示词（Shots 主路径）。"

  ltx-prompt-director:
    kind: git_skills
    source_repository: https://github.com/AI-KSK/ltx-2-3-prompt-director
    commit: "c9487b13178cf3c0c109ce55c49828df8909a7c0"
    sparse_paths: []
    skill_source: auto
    skill_dir_name: ltx-prompt-director
    license: unknown
    usage: production_allowed
    note: "LTX-2.3 production prompt director (Shots by LTX companion)."

  epidemic-sound:
    kind: curated_skill
    source_repository: https://www.epidemicsound.com/a/mcp-service/mcp
    skill_dir_name: epidemic-sound
    license: proprietary
    usage: production_allowed
    note: "No public SKILL.md repo; curated entry points at official Epidemic Sound MCP."

  moneyprinterturbo:
    kind: git_skills
    source_repository: https://github.com/harry0703/MoneyPrinterTurbo
    commit: "254cd028906ee657eab844dc94087cdbea2a7aa8"
    sparse_paths:
      - docs/skill
    skill_source: docs/skill
    skill_dir_name: moneyprinterturbo
    license: MIT
    usage: production_allowed
    note: "Sparse docs/skill only — do not full-clone the monorepo into third_party_skills."

  video-shotcraft:
    kind: git_skills
    source_repository: https://github.com/Vincentwei1021/video-shotcraft
    commit: "d4915443232e89527fdc9d7e79f132ba411fc440"
    sparse_paths: []
    skill_source: .
    skill_dir_name: video-shotcraft
    license: Apache-2.0
    usage: reference_only
    remotion_primary_renderer: false
    note: "Shot vocabulary / pacing / sound-design reference only; Remotion demos do not replace AVS timeline.json + FFmpeg + HyperFrames."

  seedance-free:
    kind: local_skill
    skill_dir_name: seedance-free
    license: project
    usage: production_allowed
    note: "Project-authored free Seedance substitute (FFmpeg Ken Burns); not cloned from GitHub."
