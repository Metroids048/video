[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-os"
version = "2.0.0"
description = "Creator OS V2: evidence-led, publish-ready creator production"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "rich>=13.7",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "coverage>=7.3",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-jsonschema>=4.25",
    "types-PyYAML>=6.0",
]
dev-tts = [
    "edge-tts>=7.2,<8",
]

[project.scripts]
avs = "avs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/avs"]
omit = ["src/avs/__main__.py"]
