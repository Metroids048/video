# tools-manifest.yaml
# Agent Video Studio V1 — 工具版本清单
# 本文件是 doctor 命令的权威依据，所有版本约束均在此声明。
# 修改此文件需同步更新 src/avs/doctor.py 中的检查逻辑（模块1实现）。

version: "1"
updated_at: "2026-08-03"

# ── 必需工具（缺失时 doctor 返回非零退出码）────────────────────────────────────
required:
  git:
    min_version: "2.40.0"
    check_command: "git --version"
    version_pattern: "git version (\\S+)"
    purpose: "版本控制；每个模块单独提交"

  python:
    min_version: "3.11.0"
    check_command: "AGENT_PYTHON --version (Windows) / python3 --version (Unix)"
    version_pattern: "Python (\\S+)"
    purpose: "唯一业务 CLI 运行时；状态机、媒体处理、QA、交付"

  nodejs:
    min_version: "22.0.0"
    check_command: "node --version"
    version_pattern: "v(\\S+)"
    purpose: "npm 包装命令；Skills 安装脚本；HyperFrames CLI"

  ffmpeg:
    min_version: "6.0.0"
    check_command: "ffmpeg -version"
    version_pattern: "ffmpeg version (\\S+)"
    purpose: "媒体转码、粗剪、字幕嵌入、HyperFrames 合成"

  ffprobe:
    min_version: "6.0.0"
    check_command: "ffprobe -version"
    version_pattern: "ffprobe version (\\S+)"
    purpose: "输入素材元数据检测；损坏文件识别"

  hyperframes:
    check_command: "npx hyperframes --version"
    version_pattern: "(\\S+)"
    purpose: "动效片段渲染（HookTitle / InfoCard / EndCard）"
    note: >
      通过 npx hyperframes skills 安装官方 Skills。
      通过 npx hyperframes browser ensure 安装本地渲染浏览器。
      doctor 调用框架自检命令，不硬编码 Chromium 路径。

# ── 推荐工具（缺失时 doctor 返回 WARNING，不阻断核心流程）──────────────────────
optional:
  git_lfs:
    check_command: "git lfs version"
    version_pattern: "git-lfs/(\\S+)"
    purpose: "大型测试 Fixture 跟踪；真实用户素材默认不启用"
    default_enabled: false
    note: "仅在需要提交较大 Fixture 或黄金测试基准时启用"

  whisper_cpp:
    check_command: "whisper-cpp --version"
    purpose: "本地转写 Provider（transcription.provider=whisper_cpp）"
    note: "通过 Provider 适配器加载；缺失时自动降级为 manual 模式"

  chromium:
    purpose: "HyperFrames 渲染依赖；由 HyperFrames/Puppeteer 管理"
    note: >
      doctor 通过 npx hyperframes doctor 间接检查，
      不直接检测系统 Chromium 路径，避免版本绑定。

  remotion:
    check_command: "npx remotion --version"
    purpose: "代码驱动视频渲染（按 docs/video-plugin-routing.md 启用）"
    default_enabled: false
    note: >
      Skills 来自 remotion-dev/skills，已 vendor 到 third_party_skills/。
      缺失时 doctor WARNING，不阻断 FFmpeg 粗剪。

  video_use:
    purpose: "对话式粗剪 / EDL（browser-use/video-use）"
    default_enabled: false
    note: "Skill 位于 third_party_skills/video-use；缺失时 WARNING。"

  chatcut:
    purpose: "ChatCut 云端可编辑时间线（需 MCP 登录）"
    default_enabled: false
    note: "Skills 位于 third_party_skills/chatcut；不存储登录态。"

  capcut_david:
    check_command: "capcut-david --help"
    purpose: "CapCut/剪映草稿 CLI（原 cut-motion 继任）"
    default_enabled: false
    note: "Skill 位于 third_party_skills/capcut-david。"

  jianying_editor:
    purpose: "剪映 JyWrapper 自动化（与 cut-skill 并存分流）"
    default_enabled: false
    note: "Skill 位于 third_party_skills/jianying-editor；按 docs/video-plugin-routing.md 调用。"

  ffmpeg_skill:
    purpose: "FFmpeg 音视频处理 Agent Skill（命令库）"
    default_enabled: false
    note: "Skill 位于 third_party_skills/ffmpeg；系统仍需安装 ffmpeg/ffprobe 可执行文件。"

  azure_speech:
    purpose: "Azure Speech TTS/STT（可选付费升级）"
    default_enabled: false
    note: "Skill 位于 third_party_skills/azure-speech；密钥仅放 .env。"

  elevenlabs:
    purpose: "ElevenLabs 高表现配音 / SFX / 音乐（可选付费升级）"
    default_enabled: false
    note: "Skills 位于 third_party_skills/elevenlabs 与 text-to-speech；默认优先免费 Whisper/Edge TTS。"

  ai_video_shot_prompt:
    purpose: "镜头脚本 / 分镜提示词"
    default_enabled: false
    note: "Skill 位于 third_party_skills/ai-video-shot-prompt。"

  ltx_prompt_director:
    purpose: "LTX-2.3 生产提示词导演"
    default_enabled: false
    note: "Skill 位于 third_party_skills/ltx-prompt-director。"

  epidemic_sound:
    purpose: "Epidemic Sound 版权音乐 MCP 入口"
    default_enabled: false
    note: "Curated Skill 位于 third_party_skills/epidemic-sound；需官方 MCP 账号。"

  moneyprinterturbo:
    purpose: "主题一键短视频旁路（产物回挂 Episode）"
    default_enabled: false
    note: "仅 vendor docs/skill；位于 third_party_skills/moneyprinterturbo；不得伪造状态机。"

  pixelle_video:
    purpose: "Pixelle-Video 主题一键短视频旁路（ComfyUI/直连 API）"
    default_enabled: false
    note: "Sparse README/docs；curated Skill 位于 third_party_skills/pixelle-video；产物回挂 Episode。"

  openmontage:
    purpose: "OpenMontage 多管线 Agent 制片旁路"
    default_enabled: false
    note: "Sparse vendor + curated Skill；位于 third_party_skills/openmontage；AGPL-3.0。"

# ── 明确延后（不安装，不检测）────────────────────────────────────────────────
deferred_post_v1:
  - name: "heygen_digital_human"
    reason: "数字人和声音克隆不在 V1 范围"
  - name: "cloud_render"
    reason: "云端分布式渲染不在 V1 范围"
  - name: "auto_publish_sdk"
    reason: "自动发布抖音/小红书不在 V1 范围"

# ── 画布规格（FFmpeg 渲染基准）─────────────────────────────────────────────────
canvas:
  width: 1080
  height: 1920
  fps: 30
  video_codec: "libx264"
  audio_codec: "aac"
  pixel_format: "yuv420p"
  platforms:
    - douyin
    - xiaohongshu
