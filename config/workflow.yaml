# Creator OS V2 workflow
# Low-level AVS states stay compatible with the existing engine.
# User-facing production uses public_lifecycle below.
workflow:
  transitions:
    CREATED: [INGESTED, WAITING_FOR_INPUT, BLOCKED, FAILED]
    INGESTED: [REFERENCE_READY, CONTENT_READY, WAITING_FOR_INPUT, BLOCKED, FAILED]
    REFERENCE_READY: [CONTENT_READY, WAITING_FOR_REVIEW, BLOCKED, FAILED]
    CONTENT_READY: [ASSETS_READY, WAITING_FOR_REVIEW, BLOCKED, FAILED]
    ASSETS_READY: [TIMELINE_READY, WAITING_FOR_INPUT, BLOCKED, FAILED]
    TIMELINE_READY: [PILOT_APPROVED, ROUGH_CUT_READY, BLOCKED, FAILED]
    PILOT_APPROVED: [ROUGH_CUT_READY, WAITING_FOR_REVIEW, BLOCKED, FAILED]
    ROUGH_CUT_READY: [QA_PASSED, WAITING_FOR_REVIEW, BLOCKED, FAILED]
    QA_PASSED: [DELIVERY_READY, BLOCKED, FAILED]
    DELIVERY_READY: []
    WAITING_FOR_INPUT: [INGESTED, CREATED, FAILED]
    WAITING_FOR_REVIEW: [CONTENT_READY, ASSETS_READY, QA_PASSED, FAILED]
    BLOCKED: []
    FAILED: [CREATED]

  force_reset_targets: [CREATED, INGESTED, CONTENT_READY]

  public_lifecycle:
    - CREATED
    - INPUT_READY
    - RESEARCH_READY
    - CREATIVE_LOCKED
    - PRODUCING
    - REVIEWING
    - REPAIRING
    - READY_TO_PUBLISH

  exceptional_public_states:
    - WAITING_FOR_RESOURCE
    - BLOCKED
    - FAILED

  engine_to_public:
    CREATED: CREATED
    INGESTED: INPUT_READY
    REFERENCE_READY: RESEARCH_READY
    CONTENT_READY: CREATIVE_LOCKED
    ASSETS_READY: PRODUCING
    TIMELINE_READY: PRODUCING
    PILOT_APPROVED: PRODUCING
    ROUGH_CUT_READY: REVIEWING
    QA_PASSED: REVIEWING
    DELIVERY_READY: READY_TO_PUBLISH
    WAITING_FOR_INPUT: WAITING_FOR_RESOURCE
    WAITING_FOR_REVIEW: REVIEWING
    BLOCKED: BLOCKED
    FAILED: FAILED

  stages:
    - ingest
    - reference-acquire
    - reference-analyze
    - evidence-map
    - creative-contract
    - format-route
    - voice-audition
    - assets
    - pilot
    - production
    - source-inventory
    - source-to-final-fidelity-review
    - technical-review
    - creative-review
    - continuous-video-review
    - validate-video-release-review
    - repair
    - approval
    - delivery
    - publish-pack

  video_release_gate:
    applies_when: "format == VIDEO and publishable == true"
    input: "work/qa/video-release-review.input.json"
    validated_record: "work/qa/video-release-review.json"
    validator: "scripts/validate_video_release_review.py"
    requires_source_inventory: true
    requires_source_to_final_fidelity_review: true
    requires_current_source_sha256s: true
    requires_current_final_sha256: true
    missing_or_invalid_routes_to: REPAIRING
    stale_sha256_routes_to: REPAIRING
    stale_source_sha256_routes_to: REPAIRING
    unauthorized_destructive_crop_routes_to: REPAIRING
    source_context_loss_routes_to: REPAIRING
    spatial_continuity_break_routes_to: REPAIRING
    temporal_continuity_break_routes_to: REPAIRING
    opening_mid_action_routes_to: REPAIRING
    critical_findings_route_to: REPAIRING
    unresolved_after_3_repairs_routes_to: BLOCKED
    approval_must_happen_after_gate: true
    delivery_must_reverify_gate: true
    fail_closed: true

  repair:
    max_rounds: 3
    localized: true
    full_rewatch_after_each_video_repair: true
    repeat_source_to_final_after_layout_or_timeline_change: true
    invalidate_old_release_review_after_rerender: true
    invalidate_old_release_review_after_source_change: true
    failure_routes:
      SOURCE_FIDELITY_FAIL: layout_or_timeline
      DESTRUCTIVE_CROP: visual_composition
      SPATIAL_CONTINUITY_BROKEN: visual_composition
      TEMPORAL_CONTINUITY_BROKEN: cut_structure
      OPENING_MID_ACTION: cut_structure
      VOICE_BAD: audio
      HOOK_WEAK: pilot
      SCREEN_UNREADABLE: visual_composition
      CONTINUITY_BROKEN: cut_structure
      SLIDESHOW_FEEL: source_motion
      RAPID_DARK_LIGHT_SWITCHING: evidence_grouping
      KEY_EVIDENCE_REQUIRES_PAUSE: shot_timing
      AUDIO_VISUAL_MISMATCH: edit_alignment
      CAPTION_BLOCKING: captions
      STORY_CONFUSED: creative_director
      FACT_UNSUPPORTED: evidence_map
