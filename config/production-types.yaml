production_types:
  SCREEN_DOCUMENTARY:
    target_duration_seconds: [25, 60]
    pilot_seconds: [20, 30]
    real_screen_footage_min_ratio: 0.70
    generated_fullscreen_cards_max: 2
    generated_fullscreen_cards_total_seconds_max: 5
    no_intro_card: true
    no_logo_intro: true
    first_3_seconds_prefer_real_evidence: true
    full_landscape_fit_allowed: true
    landscape_default_layout: fit_full_frame
    preserve_full_landscape_source_by_default: true
    full_frame_context_required_before_roi: true
    destructive_crop_requires_explicit_authorization: true
    destructive_crop_authorization_flag: allow_destructive_crop
    roi_requires_context: true
    source_temporal_order: monotonic_after_optional_cold_open
    cold_open_max_seconds: 4
    forbid_fake_cursor: true
    forbid_ken_burns_process_motion: true
    forbid_unmotivated_pan_zoom: true
    mobile_readability_required: true
    narration_master_required: true
    subtitle_alignment_source: word_timestamps

  VISUAL_EXPLAINER:
    target_duration_seconds: [25, 60]
    pilot_seconds: [15, 25]
    real_evidence_required: true
    decorative_motion_only: false

  LONG_SCREEN_DOCUMENTARY:
    target_duration_seconds: [60, 120]
    use_only_when_story_requires_length: true
    pilot_seconds: [20, 30]
    mobile_readability_required: true
