reference_acquisition:
  version: "2.0"
  cache_enabled: true
  deduplicate_by_source_url_and_media_hash: true
  preserve_source_metadata: true
  primary_reference:
    strategy: single_main_reference
    require_audiovisual_evidence_for_recipe: true

  sources:
    local_video:
      level: audiovisual
      action: ingest_then_analyze
    douyin_url:
      level_when_media_acquired: audiovisual
      level_when_media_unavailable: page_only
      action: resolve_acquire_cache_then_analyze
      bypass_login_or_access_controls: false
      failure_behavior: degrade_honestly
    generic_url:
      level_when_media_acquired: audiovisual
      level_when_media_unavailable: page_only
      failure_behavior: degrade_honestly

  acquired_reference_outputs:
    - video.mp4
    - source.json
    - transcript.srt
    - transcript.words.json
    - shots.json
    - keyframes
    - contact-sheet.jpg
    - audio-analysis.json
    - cover-analysis.json
    - reference-recipe.json
    - provenance.json

  prohibitions:
    - "不得在下载失败时推断具体镜头、节奏、字幕和声音设计"
    - "不得复制原视频文案、配音、素材、案例、数据、标题和封面"
