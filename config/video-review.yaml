video_review:
  version: "2026-08-16-v3"
  purpose: "Prevent technically valid but visually broken, slideshow-like, unreadable or discontinuous videos from being delivered."
  source_of_truth: "actual rendered video pixels and audible audio"

  canonical_artifacts:
    input: "work/qa/video-release-review.input.json"
    validated_record: "work/qa/video-release-review.json"
    schema: "schemas/video-release-review.schema.json"
    validator: "scripts/validate_video_release_review.py"
    bind_to_video_sha256: true
    any_media_change_invalidates_previous_pass: true

  required_review_views:
    continuous_playback_1x:
      required: true
      watch_start_to_end: true
      first_pass_no_pause_for_comprehension: true
      require_first_pass_memory_summary: true
      rule: "A pass requires the reviewer to understand the intended story and key evidence at normal playback speed without pausing, scrubbing or replaying to rescue comprehension."
    first_second_review:
      required: true
      rule: "Inspect the opening from frame 1. It must not feel like missing frames, an abrupt mid-action start, or a still image suddenly being pushed by camera motion."
    first_10s_dense_review:
      required: true
      rule: "Inspect 0-10s densely for hook continuity, abrupt jumps, fake motion, readability and whether the viewer can orient before the next change."
    transition_scan:
      required: true
      inspect_every_boundary: true
      rule: "Inspect every scene boundary and every high-contrast dark/light switch. Count alone is not the metric; repeated context-breaking jumps are a hard failure."
    mobile_preview:
      required: true
      size: "360x640"
      rule: "Key proof, captions and UI context must be readable on a phone without hunting across a desktop frame."
    audio_listen:
      required: true
      listen_start_to_end: true
      rule: "Listen to the actual final mix for intelligibility, sync, natural phrasing, clipping, silence and abrupt audio edits."

  hard_fail_conditions:
    abrupt_or_discontinuous_opening:
      fail: true
      description: "The first seconds feel cut-in, missing, frozen, or compositionally discontinuous instead of intentionally starting the story."
    slideshow_feel:
      fail: true
      description: "The video feels like a sequence of screenshots/cards rather than a coherent moving piece."
    static_screenshot_pan_zoom_dominant:
      fail: true
      description: "Ken-Burns-style pan/zoom on still screenshots is the primary source of motion or is used to fake a real process."
    key_evidence_requires_pause:
      fail: true
      description: "A normal viewer must pause, scrub or replay to identify the key evidence being discussed."
    unreadable_evidence_due_to_short_dwell:
      fail: true
      description: "Important evidence disappears before a normal viewer can orient, locate and understand it at 1x speed."
    repeated_unmotivated_hard_cuts:
      fail: true
      description: "Cuts repeatedly happen because of timing targets rather than a semantic change, causing loss of orientation."
    rapid_dark_light_switching:
      fail: true
      description: "Repeated dark-exchange / bright-backend alternation creates flash-like interruption or context loss."
    abrupt_context_loss:
      fail: true
      description: "Crop, zoom or cut removes the page title/tab/label needed to understand the proof."
    visual_motion_without_semantic_reason:
      fail: true
      description: "Motion exists only to make the frame move; it does not follow cursor/action/data change/attention."
    audio_visual_semantic_mismatch:
      fail: true
      description: "Narration discusses an order, fill, rejection, result or risk while unrelated proof is on screen."
    caption_or_overlay_blocks_evidence:
      fail: true
      description: "Captions, banners or overlays cover balances, orders, charts, positions or other primary evidence."
    known_critical_issue_at_delivery:
      fail: true
      description: "Any critical viewer-facing defect is still known when delivery is attempted."

  continuity_rules:
    prefer_real_screen_recording_for_process: true
    no_forced_cut_rate: true
    no_max_shot_duration_as_quality_target: true
    no_minimum_shot_count_as_quality_target: true
    no_target_visual_change_count: true
    semantic_change_may_happen_inside_one_continuous_shot: true
    keep_orientation_before_detail: true
    rule: "A longer coherent shot is better than several unreadable short shots. A shorter video is not better if compression destroys comprehension."

  still_image_rules:
    stills_are_allowed_as_stills: true
    may_not_simulate_continuous_interaction: true
    ken_burns_as_primary_motion_for_process: false
    repeated_pan_zoom_on_ui_screenshots: false
    screenshot_sequence_must_not_be_primary_video_language: true
    rule: "If only a still exists, present it honestly and use one restrained semantic emphasis; do not pretend the system is operating through camera motion."

  readability_rules:
    key_evidence_understandable_at_1x: true
    give_viewer_time_to_orient: true
    one_primary_attention_target_at_a_time: true
    context_then_roi: true
    duration_is_semantic_not_fixed: true
    no_pause_needed_for_key_claims: true
    rule: "Evidence stays on screen long enough to locate, read and understand. Do not enforce arbitrary 1.3s/1.8s shot caps."

  pacing_rules:
    duration_target_is_soft: true
    never_compress_to_hit_duration_metric: true
    remove_filler_before_shortening_evidence: true
    cuts_require_semantic_reason: true
    repeated_sub_two_second_high_contrast_cuts_require_manual_review: true
    no_reward_for_more_cuts: true
    rule: "Fast pacing means no wasted seconds, not constant cutting."

  review_evidence:
    require_reviewed_video_path: true
    require_video_sha256: true
    require_continuous_playback_confirmation: true
    require_first_pass_memory_summary: true
    require_first_10s_findings: true
    require_timestamped_findings: true
    require_transition_findings: true
    require_mobile_preview_evidence: true
    require_audio_review_confirmation: true
    contact_sheet_is_supplementary_only: true
    sparse_keyframes_are_supplementary_only: true
    metadata_json_cannot_prove_visual_quality: true
    automatic_cut_counts_cannot_prove_visual_quality: true
    self_authored_pass_json_cannot_prove_visual_quality: true

  repair_loop:
    mandatory_when_failed: true
    max_rounds_default: 3
    priority_order:
      - continuity_and_readability
      - evidence_and_story_alignment
      - audio_and_sync
      - captions
      - cosmetic_polish
    order:
      - "record timestamp -> viewer problem -> root cause"
      - "repair the failing layer only"
      - "rerender affected range for diagnosis"
      - "rebuild complete candidate"
      - "recompute candidate SHA256"
      - "rewatch full candidate start-to-end at 1x"
      - "rerun first-second/first-10s/transition/mobile/audio checks"
    full_rewatch_after_every_repair: true
    cannot_reuse_old_pass_after_media_changes: true
    do_not_fix_choppiness_with_more_transitions: true
    do_not_fix_duration_by_shortening_unreadable_evidence: true
    if_still_failed_after_rounds: "BLOCKED"

  scoring:
    subjective_numeric_scores_are_advisory: true
    pass_is_not_derived_from_average_score: true
    any_hard_fail_overrides_numeric_score: true
    self_authored_json_is_not_evidence_of_quality: true
    publishing_quality_claim_requires_platform_data_when_claiming_high_retention: true

  delivery_gate:
    only_status_allowed: "READY_TO_PUBLISH"
    validated_record_required: true
    current_sha256_match_required: true
    final_name_requires_pass: true
    delivery_requires_zero_known_critical_findings: true
    delivery_requires_current_review_for_current_sha256: true
    human_approval_occurs_after_release_review: true
    on_failure: "REPAIRING"
