video_review:
  version: "2026-08-16-v4-final"
  purpose: "Fail closed unless the exact final video preserves source context, is continuously understandable at 1x, is readable on mobile, and has no known viewer-facing defect."
  source_of_truth:
    - "original source artifacts actually used"
    - "current rendered video pixels"
    - "current rendered audible audio"
  governing_principle: "A stable frame is not automatically a complete frame. Technical validity, sparse samples, self-scores, or user agreement cannot substitute for source-to-final fidelity plus continuous viewing."

  canonical_artifacts:
    input: "work/qa/video-release-review.input.json"
    validated_record: "work/qa/video-release-review.json"
    schema: "schemas/video-release-review.schema.json"
    validator: "scripts/validate_video_release_review.py"
    bind_to_video_sha256: true
    bind_to_source_sha256s: true
    any_media_change_invalidates_previous_pass: true
    any_source_change_invalidates_previous_pass: true

  mandatory_review_order:
    - "source_inventory"
    - "source_to_final_fidelity"
    - "continuous_playback_1x"
    - "first_second_and_first_10s_dense_review"
    - "transition_and_temporal_continuity_scan"
    - "mobile_readability_review"
    - "full_audio_listen"
    - "technical_media_checks"
    - "release_decision"
  technical_checks_cannot_run_first_and_imply_quality: true

  required_review_views:
    source_inventory:
      required: true
      rule: "Identify every source clip/image that materially supplies the final video, record path + SHA256, and inspect the source before judging the render."
    source_to_final_fidelity:
      required: true
      compare_source_and_final: true
      rule: "For every important screen-recording section, compare the source with the final render. Verify that page identity, meaningful edges, navigation/context, action order and cause/effect survive the edit."
    full_frame_integrity:
      required: true
      rule: "Landscape software/screen recordings default to fit_full_frame/contain. Filling 9:16 is never a reason to discard source context. Any destructive crop must be explicitly authorized and justified as a temporary ROI after context has been established."
    spatial_continuity:
      required: true
      rule: "The viewer must be able to tell where a shown ROI belongs in the original page. Do not make viewers mentally stitch together left/center/right crops."
    temporal_continuity:
      required: true
      rule: "Preserve meaningful source action order. Do not jump from state A to C when the omitted B is necessary to understand what happened."
    continuous_playback_1x:
      required: true
      watch_start_to_end: true
      first_pass_no_pause_for_comprehension: true
      require_first_pass_memory_summary: true
      rule: "A pass requires a normal first-watch understanding of the intended story and key evidence without pausing, scrubbing or replaying to rescue comprehension."
    first_second_review:
      required: true
      inspect_from_frame_zero: true
      rule: "The first frame must be a complete intentional state, not a partial crop, mid-action fragment, loading state or unexplained jump into the middle of a workflow."
    first_10s_dense_review:
      required: true
      dense_sampling_max_interval_seconds: 0.25
      rule: "Inspect 0-10s densely for source-frame completeness, hook continuity, abrupt jumps, fake motion, readability and viewer orientation."
    transition_scan:
      required: true
      inspect_every_boundary: true
      inspect_before_after_window_seconds: 0.5
      rule: "Inspect every scene boundary and high-contrast switch. A transition must have a semantic reason and preserve orientation/cause-effect."
    mobile_preview:
      required: true
      size: "360x640"
      qa_only: true
      include_in_delivery: false
      rule: "Use a temporary mobile preview only to judge readability. The formal deliverable remains the 1080x1920 master."
    audio_listen:
      required: true
      listen_start_to_end: true
      rule: "Listen to the actual final mix for intelligibility, sync, natural phrasing, clipping, silence, cut-off words and abrupt edits."

  source_fidelity_rules:
    landscape_default: "fit_full_frame"
    full_frame_preservation_over_canvas_fill: true
    allow_letterbox_or_unused_vertical_space: true
    destructive_crop_default_allowed: false
    destructive_crop_authorization_flag: "allow_destructive_crop"
    authorized_crop_requirements:
      - "context established before crop"
      - "crop has a specific evidence/attention reason"
      - "crop does not hide page identity needed for the claim"
      - "viewer can map ROI back to the full page"
      - "return to context when needed for orientation"
    crop_fill_ratio_is_not_quality: true
    source_and_final_must_be_compared_not_inferred: true

  hard_fail_conditions:
    source_to_final_fidelity_not_verified:
      fail: true
      description: "The reviewer judged only the final file and did not compare important sections against their actual source artifacts."
    source_artifact_hash_missing_or_stale:
      fail: true
      description: "Source evidence is missing, changed, or not content-addressed in the release record."
    unauthorized_destructive_crop:
      fail: true
      description: "A landscape source is cropped/reframed in a way that discards meaningful source content without explicit authorization."
    source_frame_context_lost:
      fail: true
      description: "The final render removes page identity, navigation, labels, edges or surrounding information required to understand where the viewer is."
    spatial_continuity_broken:
      fail: true
      description: "The viewer must mentally reconstruct a page from disconnected crops or cannot locate an ROI within the source page."
    temporal_continuity_broken:
      fail: true
      description: "Meaningful source action/state order is removed or reordered so the viewer experiences unexplained jumps/teleportation."
    first_frame_partial_or_mid_action:
      fail: true
      description: "Frame zero begins on an unexplained partial crop, mid-action state, loading state or cut-in rather than an intentional establishing state."
    abrupt_or_discontinuous_opening:
      fail: true
      description: "The first seconds feel missing, chopped, frozen or compositionally discontinuous."
    slideshow_feel:
      fail: true
      description: "The video feels like a sequence of screenshots/cards rather than a coherent moving piece."
    static_screenshot_pan_zoom_dominant:
      fail: true
      description: "Ken-Burns-style pan/zoom on still screenshots is the primary motion language or is used to fake a real process."
    key_evidence_requires_pause:
      fail: true
      description: "A normal viewer must pause, scrub or replay to identify the key evidence being discussed."
    unreadable_evidence_due_to_short_dwell:
      fail: true
      description: "Important evidence disappears before a normal viewer can orient, locate and understand it at 1x."
    repeated_unmotivated_hard_cuts:
      fail: true
      description: "Cuts happen for a timing/change-count target rather than semantic change and repeatedly destroy orientation."
    rapid_dark_light_switching:
      fail: true
      description: "Repeated dark/bright alternation creates flash-like interruption or context loss."
    abrupt_context_loss:
      fail: true
      description: "Crop, zoom or cut removes context needed to understand the current evidence."
    visual_motion_without_semantic_reason:
      fail: true
      description: "Motion exists only to make the frame move and does not follow real action/data/attention."
    audio_visual_semantic_mismatch:
      fail: true
      description: "Narration and the evidence visible at that moment do not support the same claim."
    caption_or_overlay_blocks_evidence:
      fail: true
      description: "Captions/banners cover balances, orders, charts, positions or primary proof."
    known_critical_issue_at_delivery:
      fail: true
      description: "Any critical viewer-facing defect remains known when delivery is attempted."

  continuity_rules:
    prefer_real_screen_recording_for_process: true
    full_page_context_before_roi: true
    source_action_order_before_pacing: true
    no_forced_cut_rate: true
    no_max_shot_duration_as_quality_target: true
    no_minimum_shot_count_as_quality_target: true
    no_target_visual_change_count: true
    semantic_change_may_happen_inside_one_continuous_shot: true
    keep_orientation_before_detail: true
    rule: "A longer coherent full-context shot is better than several attractive but incomplete fragments."

  still_image_rules:
    stills_are_allowed_as_stills: true
    may_not_simulate_continuous_interaction: true
    ken_burns_as_primary_motion_for_process: false
    repeated_pan_zoom_on_ui_screenshots: false
    screenshot_sequence_must_not_be_primary_video_language: true

  readability_rules:
    key_evidence_understandable_at_1x: true
    give_viewer_time_to_orient: true
    one_primary_attention_target_at_a_time: true
    context_then_roi: true
    duration_is_semantic_not_fixed: true
    no_pause_needed_for_key_claims: true

  pacing_rules:
    duration_target_is_soft: true
    never_compress_to_hit_duration_metric: true
    remove_filler_before_shortening_evidence: true
    cuts_require_semantic_reason: true
    repeated_sub_two_second_high_contrast_cuts_require_manual_review: true
    no_reward_for_more_cuts: true

  reviewer_independence:
    user_opinion_is_feedback_not_release_evidence: true
    positive_user_feedback_cannot_override_hard_fail: true
    negative_user_feedback_requires_independent_reproduction: true
    reviewer_must_state_observed_evidence_before_conclusion: true
    no_numeric_score_as_release_decision: true

  review_evidence:
    require_source_artifact_paths_and_sha256: true
    require_source_to_final_fidelity_notes: true
    require_reviewed_video_path: true
    require_video_sha256: true
    require_continuous_playback_confirmation: true
    require_first_pass_memory_summary: true
    require_first_10s_findings: true
    require_timestamped_findings: true
    require_transition_findings: true
    require_mobile_preview_evidence: true
    require_audio_review_confirmation: true
    contact_sheet_is_supplementary_only: true
    sparse_keyframes_are_supplementary_only: true
    metadata_json_cannot_prove_visual_quality: true
    automatic_cut_counts_cannot_prove_visual_quality: true
    self_authored_pass_json_cannot_prove_visual_quality: true

  repair_loop:
    mandatory_when_failed: true
    max_rounds_default: 3
    priority_order:
      - source_fidelity_and_frame_integrity
      - spatial_and_temporal_continuity
      - evidence_readability
      - evidence_and_story_alignment
      - audio_and_sync
      - captions
      - cosmetic_polish
    order:
      - "record timestamp -> viewer problem -> source/final evidence -> root cause"
      - "repair only the failing layer"
      - "rerender affected range for diagnosis"
      - "rebuild complete candidate"
      - "recompute candidate SHA256"
      - "recompute affected source SHA256 references when source changes"
      - "repeat source-to-final comparison"
      - "rewatch full candidate start-to-end at 1x"
      - "rerun first-second/first-10s/transition/mobile/audio checks"
    full_rewatch_after_every_repair: true
    cannot_reuse_old_pass_after_media_changes: true
    cannot_reuse_old_pass_after_source_changes: true
    do_not_fix_choppiness_with_more_transitions: true
    do_not_fix_duration_by_shortening_unreadable_evidence: true
    if_still_failed_after_rounds: "BLOCKED"

  scoring:
    subjective_numeric_scores_are_advisory: true
    pass_is_not_derived_from_average_score: true
    any_hard_fail_overrides_numeric_score: true
    self_authored_json_is_not_evidence_of_quality: true

  delivery_gate:
    only_status_allowed: "READY_TO_PUBLISH"
    validated_record_required: true
    current_sha256_match_required: true
    current_source_sha256s_match_required: true
    source_fidelity_pass_required: true
    final_name_requires_pass: true
    delivery_requires_zero_known_critical_findings: true
    delivery_requires_current_review_for_current_sha256: true
    human_approval_occurs_after_release_review: true
    formal_video_deliverable: "1080x1920 master only"
    mobile_preview_is_qa_only: true
    on_failure: "REPAIRING"
