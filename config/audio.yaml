audio:
  codec: aac
  sample_rate: 44100
  channels: 2
  bitrate: 192k
  loudness:
    target_lufs: -14
    loudness_range_lu: 7
    true_peak_db: -1.0
  narration:
    priority: true
    master_clock: true
    remove_hard_clipping: true
    max_leading_silence_seconds: 0.6
  music:
    duck_under_narration: true
    optional: true
  transcription:
    language: zh
    require_word_timestamps_for_video: true
