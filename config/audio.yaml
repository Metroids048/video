# config/audio.yaml — 音频配置

audio:
  # 输出编码
  codec: "aac"
  sample_rate: 44100
  channels: 2
  bitrate: "192k"

  # 归一化目标（LUFS）
  loudness_target: -14.0
  loudness_range: 7.0
  true_peak: -1.0

  # 无音频降级策略: silent_track | skip | warn
  missing_audio_strategy: "warn"

  # 转写（模块3+使用）
  transcription:
    provider: "whisper"          # whisper | azure | none
    language: "zh"
    model: "base"
